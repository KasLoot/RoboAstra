[project]
name = "roboastra"
version = "0.1.0"
description = "Using VLM models for direct controlling robot manipulation."
readme = "README.md"
authors = [
    { name = "KasLoot", email = "steven.liu.yuxin@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
]

[project.scripts]
roboastra = "roboastra:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
